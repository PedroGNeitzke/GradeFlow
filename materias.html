<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GradeFlow -  Gestão de Notas Inteligente</title>

    <link rel="icon" type="image/png" href="/img/Logo2.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="JS/global.js" defer></script>
    <script src="JS/materias.js" defer></script>
</head>

<body>
    <header id="header">

        <div class="header-left">
            <a href="">
            <img src="/img/Logo.png" alt="Logo" id="logo">
            </a>
        </div>

            <div class="header-center">
                <input type="search" placeholder="Buscar...">
            </div>

            <div class="header-right">
                <button class="notification-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-bell" viewBox="0 0 16 16">
                    <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2M8 1.918l-.797.161A4 4 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4 4 0 0 0-3.203-3.92zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5 5 0 0 1 13 6c0 .88.32 4.2 1.22 6"/>
                    </svg>
                </button>
            
            <div class="profile-menu">

                <button class="profile-btn">
                    <img src="/img/avatar.png" alt="avatar">

                    <div class="user-info">
                        <span>Pedro Neitzke</span>
                        <small>Aluno</small>
                    </div>

                    <span>▼</span>

                </button>

                <div class="dropdown">
                    <a href="#">Meu Perfil</a>
                    <a href="#">Configurações</a>
                    <a href="#">Sair</a>
                </div>

            </div>

            </div>

    </header>

    <div class="layout">

        <aside>
            <a href="dashboard.html">
                <i data-lucide="layout-dashboard"></i>
                <span>Dashboard</span>
            </a>

            <a href="materias.html">
                <i data-lucide="book-open"></i> 
                <span>Matérias</span>
            </a>

            <a href="avaliacoes.html">
                <i data-lucide="book-check"></i>
                <span>Avaliações</span>
            </a>

            <a href="agenda.html">
                <i data-lucide="calendar"></i>
                <span>Agenda</span>
            </a>

            <a href="desempenho.html">
                <i data-lucide="trending-up"></i>
                <span>Desempenho</span>
            </a>
        </aside>

        <main class="materiaslayout">

            <section class="hello">

                <div>
                <h2>Minhas <strong>Matérias</strong>.</h2>
                <p>Aqui, ficam todas as matérias cadastradas.</p>
                </div>

                <div>
                    <button id="btnNovaMateria">Nova Matéria</button>
                </div>

                <div class="modal-overlay" id="modalMateria">
                    <div class="modal">
                        <div>
                            <h2>Crie sua nova <strong>Matéria</strong>!</h2>
                        </div>

                         <label>Nome da Matéria</label>
                         <input type="text" placeholder="  Ex: Matemática, Física..." id="nomeMateria">

                         <label>Cor da Matéria</label>
                         <input type="color" id="corMateria">

                         <label>Período da Matéria</label>
                         <select id="periodoMateria">
                            <option value="bimestral">Bimestral</option>
                            <option value="trimestral">Trimestral</option>
                            <option value="semestral">Semestral</option>
                         </select>

                         <br>

                         <div btncontainer>
                            <button id="cancelar">Cancelar</button>
                            <button id="salvar">Salvar</button>
                         </div>

                    </div>
                </div>

            </section>

            <section>
                <div id="listaMaterias">
                    <div>
                        
                    </div>

                </div>
            </section>

        </main>
</body>
</html>
